<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a351a"/>
      <stop offset="100%" stop-color="#261b0c"/>
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf0cf"/>
      <stop offset="50%" stop-color="#edd18e"/>
      <stop offset="100%" stop-color="#d9af5d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 背景ベース -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="#b9934c" stroke-width="6" opacity="0.6"/>

  <!-- 将棋駒（外側影つき） -->
  <g filter="url(#shadow)">
    <!-- 駒の黒縁 -->
    <polygon points="256,64 416,140 452,430 60,430 96,140" fill="#2d1a08"/>
    <!-- 駒の木肌面 -->
    <polygon points="256,76 404,146 438,418 74,418 108,146" fill="url(#wood)"/>
    <!-- 駒の内枠ハイライト -->
    <polygon points="256,92 392,154 422,404 90,404 120,154" fill="none" stroke="#fff" stroke-width="3" opacity="0.4"/>
  </g>

  <!-- 漢字「王将」 -->
  <text x="256" y="248" font-family="'Yu Mincho', 'Hiragino Mincho ProN', 'MS Mincho', serif" font-weight="900" font-size="124" fill="#1b1209" text-anchor="middle" dominant-baseline="central">王</text>
  <text x="256" y="360" font-family="'Yu Mincho', 'Hiragino Mincho ProN', 'MS Mincho', serif" font-weight="900" font-size="124" fill="#1b1209" text-anchor="middle" dominant-baseline="central">将</text>
</svg>
