<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>中村将棋倶楽部</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- キャッシュ無効化（HTML側）。サーバー配信時は dist/ の .htaccess / _headers / web.config も併用 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3b2a14">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<script>
/* CSS / JS を毎回違うURLで読み込み、ブラウザのキャッシュを使わせない */
(function () {
  window.__BUILD = Date.now();
  document.write('<link rel="stylesheet" href="css/style.css?_=' + window.__BUILD + '">');
})();
</script>
</head>
<body>
<noscript><p style="padding:20px;font-size:20px">このアプリは JavaScript が必要です。ブラウザの設定で JavaScript を有効にしてください。</p></noscript>

<div id="app" class="landscape">

  <!-- ===================== 画面①：メニュー ===================== -->
  <section id="menu-screen" class="screen active">
    <div class="menu-scroll scrollable">
      <div class="menu-card">
        <div class="title-header">
          <h1 class="title"><span class="title-mark">☗</span> 中村将棋倶楽部</h1>
          <button type="button" id="btn-show-qr" class="btn-qr-badge" title="アプリの共有・配布用QRコードを表示" aria-label="共有QRコードを表示">
            <svg class="qr-svg-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M2 2h8v8H2V2zm2 2v4h4V4H4zm10-2h8v8h-8V2zm2 2v4h4V4h-4zM2 14h8v8H2v-8zm2 2v4h4v-4H4zm14-2h4v3h-4v-3zm0 5h2v3h-2v-3zm-4-5h2v5h-2v-5zm0 6h4v1h-4v-1zm-2-6h1v8h-1v-8zm1-2h4v1h-4v-1zm4-3h1v2h-1V9zm-2 0h1v1h-1V9z"/>
            </svg>
            <span>共有QR</span>
          </button>
        </div>
        <p class="subtitle">対局の設定を選んで「対局開始」を押してください</p>

        <fieldset class="group">
          <legend>対戦モード</legend>
          <div class="choices" id="grp-mode">
            <label class="choice"><input type="radio" name="mode" value="ai" checked><span>人間 vs AI<small>コンピュータと対戦</small></span></label>
            <label class="choice"><input type="radio" name="mode" value="pvp"><span>人間 vs 人間<small>1台を共有して対面対局</small></span></label>
          </div>
        </fieldset>

        <fieldset class="group" id="grp-level-wrap">
          <legend>AIの強さ</legend>
          <div class="choices five" id="grp-level">
            <label class="choice"><input type="radio" name="level" value="1"><span>Lv.1 入門<small>動きを覚える用</small></span></label>
            <label class="choice"><input type="radio" name="level" value="2" checked><span>Lv.2 初級<small>駒得・成り狙い</small></span></label>
            <label class="choice"><input type="radio" name="level" value="3"><span>Lv.3 中級<small>攻守のバランス</small></span></label>
            <label class="choice"><input type="radio" name="level" value="4"><span>Lv.4 上級<small>深く読む</small></span></label>
            <label class="choice"><input type="radio" name="level" value="5"><span>Lv.5 最強<small>本気モード</small></span></label>
          </div>
        </fieldset>

        <fieldset class="group" id="grp-side-wrap">
          <legend>手番（人間 vs AI のとき）</legend>
          <div class="choices three" id="grp-side">
            <label class="choice"><input type="radio" name="side" value="sente" checked><span>先手（下側）</span></label>
            <label class="choice"><input type="radio" name="side" value="gote"><span>後手（上側）</span></label>
            <label class="choice"><input type="radio" name="side" value="random"><span>振り駒<small>ランダム</small></span></label>
          </div>
        </fieldset>

        <fieldset class="group">
          <legend>初心者サポート機能</legend>
          <div class="switches">
            <label class="switch"><input type="checkbox" id="opt-guide" checked><span class="sw-track"><i></i></span><span class="sw-text">移動先ガイド表示<small>選んだ駒が動けるマスを光らせます</small></span></label>
            <label class="switch"><input type="checkbox" id="opt-hint" checked><span class="sw-track"><i></i></span><span class="sw-text">AIヒント機能（コーチ）<small>おすすめの手を盤面で光らせるボタンを表示</small></span></label>
            <label class="switch"><input type="checkbox" id="opt-blunder" checked><span class="sw-track"><i></i></span><span class="sw-text">悪手警告（これまずいかも？）<small>危ない手を指した時に警告とやり直しを表示</small></span></label>
            <label class="switch"><input type="checkbox" id="opt-warn" checked><span class="sw-track"><i></i></span><span class="sw-text">反則・王手警告メッセージ<small>二歩や王手放置の理由を日本語でお知らせ</small></span></label>
            <label class="switch"><input type="checkbox" id="opt-undo" checked><span class="sw-track"><i></i></span><span class="sw-text">「待った」を許可<small>1手戻すボタンを表示します</small></span></label>
            <label class="switch"><input type="checkbox" id="opt-anim" checked><span class="sw-track"><i></i></span><span class="sw-text">駒のアニメーション<small>駒がスッと滑らかに動きます</small></span></label>
            <label class="switch"><input type="checkbox" id="opt-drag" checked><span class="sw-track"><i></i></span><span class="sw-text">駒のドラッグ操作<small>ドラッグ＆ドロップでも指せます</small></span></label>
            <label class="switch"><input type="checkbox" id="opt-sound" checked><span class="sw-track"><i></i></span><span class="sw-text">駒音・効果音<small>パチッという着手音や和風効果音を鳴らします</small></span></label>
            <label class="switch"><input type="checkbox" id="opt-eval"><span class="sw-track"><i></i></span><span class="sw-text">形勢判断バーを表示<small>どちらが優勢かを帯で表示します</small></span></label>
          </div>
        </fieldset>

        <button id="btn-start" class="btn-primary" type="button">対局開始</button>
        <p class="ver">Ver <span id="app-version"></span> ／ Step 1-2 プロトタイプ</p>
      </div>
    </div>
  </section>

  <!-- ===================== 画面②③：対局 ===================== -->
  <section id="game-screen" class="screen">
    <div id="layout">

      <aside id="area-left" class="side">
        <div class="player-info" id="info-top"><i class="lamp"></i><div><div class="pname"></div><div class="psub"></div></div></div>
        <div class="hand" id="hand-top"></div>
      </aside>

      <main id="area-center">
        <div id="status-bar" class="status"><span id="status-text"></span><button type="button" id="btn-sound-toggle" class="sound-toggle-btn" title="効果音 ON/OFF" aria-label="効果音切り替え">🔊</button></div>
        <div id="eval-wrap"><div id="eval-bar"><div id="eval-black"></div></div><span id="eval-label"></span></div>
        <div id="board-wrap">
          <div id="file-labels" class="labels-h"></div>
          <div id="board"></div>
          <div id="rank-labels" class="labels-v"></div>
        </div>
      </main>

      <aside id="area-right" class="side scrollable">
        <div class="player-info" id="info-bottom"><i class="lamp"></i><div><div class="pname"></div><div class="psub"></div></div></div>
        <div class="hand" id="hand-bottom"></div>

        <div class="controls" id="controls">
          <button type="button" class="btn" id="btn-hint">ヒント</button>
          <button type="button" class="btn" id="btn-undo">待った</button>
          <button type="button" class="btn" id="btn-resign">投了</button>
          <button type="button" class="btn" id="btn-flip">盤面反転</button>
          <button type="button" class="btn" id="btn-full">全画面</button>
          <button type="button" class="btn" id="btn-menu">メニューへ</button>
        </div>

        <div class="review" id="review">
          <div class="review-title">感想戦</div>
          <div class="review-btns">
            <button type="button" class="btn" id="rv-first">|&lt;&lt; 初手</button>
            <button type="button" class="btn" id="rv-prev">&lt; 戻る</button>
            <button type="button" class="btn" id="rv-next">進む &gt;</button>
            <button type="button" class="btn" id="rv-last">終局 &gt;&gt;|</button>
          </div>
        </div>

        <div class="kifu scrollable" id="kifu"></div>
      </aside>

    </div>
  </section>

  <!-- ===================== モーダル ===================== -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-preview" id="modal-preview"></div>
      <div class="modal-msg" id="modal-msg"></div>
      <div class="modal-btns" id="modal-btns"></div>
    </div>
  </div>

  <!-- ===================== QRコード配布モーダル ===================== -->
  <div id="qr-modal" class="modal" hidden>
    <div class="modal-box qr-modal-box">
      <div class="modal-title">📱 アプリ配布・共有</div>
      <div class="qr-preview-wrap" id="qr-code-container"></div>
      <p class="qr-desc">スマホやタブレットのカメラで読み取ると、すぐに「中村将棋倶楽部」を開けます。</p>
      <div class="qr-url-box">
        <input type="text" id="qr-url-text" class="qr-url-input" readonly>
        <button type="button" id="btn-copy-url" class="btn btn-copy">コピー</button>
      </div>
      <div class="modal-btns" style="margin-top:14px">
        <button type="button" id="btn-close-qr" class="btn-primary" style="width:100%">閉じる</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var list = ['js/qrcode.js', 'js/sound.js', 'js/game-engine.js', 'js/ai-worker.js', 'js/board-ui.js', 'js/main.js'];
  list.forEach(function (src) {
    document.write('<script src="' + src + '?_=' + window.__BUILD + '"><\/script>');
  });
  if ('serviceWorker' in navigator && window.location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js?_=' + window.__BUILD).catch(function () {});
  }
})();
</script>
</body>
</html>
