<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#070913" />
    </radialGradient>
    
    <!-- クリスタルシアン -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cffafe" />
      <stop offset="25%" stop-color="#06b6d4" />
      <stop offset="85%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>

    <!-- クリスタルパープル -->
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff" />
      <stop offset="25%" stop-color="#c084fc" />
      <stop offset="85%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <!-- クリスタルゴールド -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="25%" stop-color="#facc15" />
      <stop offset="85%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- ネオングローフィルター -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="110" fill="url(#bg-grad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="4"/>

  <!-- アイコンシンボル (T型クリスタルブロック & スパーク) -->
  <g filter="url(#glow)">
    <!-- Tミノ上部左 -->
    <rect x="116" y="160" width="86" height="86" rx="16" fill="url(#purple-grad)" stroke="#fff" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M118 162 L180 162 L118 224 Z" fill="#fff" fill-opacity="0.5"/>

    <!-- Tミノ上部中央 -->
    <rect x="212" y="160" width="86" height="86" rx="16" fill="url(#cyan-grad)" stroke="#fff" stroke-opacity="0.5" stroke-width="2"/>
    <path d="M214 162 L276 162 L214 224 Z" fill="#fff" fill-opacity="0.6"/>

    <!-- Tミノ上部右 -->
    <rect x="308" y="160" width="86" height="86" rx="16" fill="url(#gold-grad)" stroke="#fff" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M310 162 L372 162 L310 224 Z" fill="#fff" fill-opacity="0.5"/>

    <!-- Tミノ下部中央 -->
    <rect x="212" y="256" width="86" height="86" rx="16" fill="url(#purple-grad)" stroke="#fff" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M214 258 L276 258 L214 320 Z" fill="#fff" fill-opacity="0.5"/>
  </g>

  <!-- スパーク星 -->
  <path d="M370 120 Q370 135 385 135 Q370 135 370 150 Q370 135 355 135 Q370 135 370 120 Z" fill="#fff" filter="url(#glow)"/>
  <path d="M140 280 Q140 292 152 292 Q140 292 140 304 Q140 292 128 292 Q140 292 140 280 Z" fill="#67e8f9" filter="url(#glow)"/>
  <path d="M330 360 Q330 375 345 375 Q330 375 330 390 Q330 375 315 375 Q330 375 330 360 Z" fill="#facc15" filter="url(#glow)"/>
</svg>
